<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Weekly Order Sheet</title>
<link rel="icon" type="image/png" href="https://cdn.prod.website-files.com/66bf86002aa4b96f4221ea70/679d9c41feedccbd26eaf752_Black%20n%20White%20Favicon.png">
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/hansen-grotesque">
<style>
/* Layout: one cream column. Week chips, supplier list per brand, then orders by member. */
:root{
  --green:#3a503c; --cream:#fef3e5;
  --soft:rgba(58,80,60,.66); --faint:rgba(58,80,60,.14); --wash:rgba(58,80,60,.06);
  --CA:'ITC Caslon 224','Caslon','Big Caslon',Georgia,serif;
  --HG:'Hansen Grotesque','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--cream);color:var(--green);font-family:var(--HG);font-size:15px;line-height:1.45}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding-inline:20px;padding-block:36px 80px}
.label{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
h1{font-family:var(--CA);font-style:italic;font-weight:400;font-size:clamp(36px,6vw,54px);line-height:1.02;margin:8px 0 6px}
h2{font-family:var(--CA);font-style:italic;font-weight:400;font-size:28px;margin:40px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--green);border-radius:999px;padding:7px 15px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--green);color:var(--cream)}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--green);color:var(--cream);border-radius:999px;padding:11px 20px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--green)}
.btn[disabled]{opacity:.5;cursor:default}
.link{font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:4px}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0 6px}
.stat{background:var(--green);color:var(--cream);border-radius:14px;padding:14px 20px;min-width:140px}
.stat b{display:block;font-family:var(--CA);font-style:italic;font-weight:400;font-size:34px;line-height:1}
.stat span{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.msg{font-size:13px;font-weight:600;min-height:1.2em;margin-top:10px}
.rows{display:grid}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:6px 14px;align-items:start;padding:14px 0;border-top:1px solid var(--faint)}
.row:last-child{border-bottom:1px solid var(--faint)}
.qty{font-family:var(--CA);font-style:italic;font-size:26px;line-height:1}
.prod{font-weight:600}
.meta{font-size:12px;color:var(--soft);overflow-wrap:anywhere}
.right{text-align:right;display:grid;gap:6px;justify-items:end}
.pill{border:1px solid var(--green);border-radius:999px;padding:4px 11px;font-size:11px;font-weight:600;letter-spacing:.06em;white-space:nowrap}
.pill.s1{background:rgba(58,80,60,.18)}
.pill.s2{background:rgba(58,80,60,.45);color:var(--cream)}
.pill.s3{background:var(--green);color:var(--cream)}
.member{padding:18px 0;border-top:1px solid var(--faint);display:grid;gap:8px}
.member .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.member .nm{font-family:var(--CA);font-style:italic;font-size:22px}
.member .contact{font-size:13px;user-select:all}
.line{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:14px;padding-left:2px}
.line .t{min-width:0;overflow-wrap:anywhere}
.empty{font-family:var(--CA);font-style:italic;font-size:20px;color:var(--soft);padding:30px 0}
.gate{max-width:420px;margin:12vh auto 0;display:grid;gap:14px}
.gate input{border:0;border-bottom:1px solid var(--green);background:transparent;padding:10px 0;font-size:18px;width:100%}
.legend{font-size:12px;color:var(--soft);margin-top:6px}
/* pickup sheets: one page per member, printed from this page */
#printArea{display:none}
@media print{
  @page{size:letter;margin:.55in}
  body{background:#fff}
  body.printing .wrap{display:none}
  body.printing #printArea{display:block}
  .ps{page-break-after:always;break-after:page;color:#1f2a20;font-size:12.5pt}
  .ps:last-child{page-break-after:auto;break-after:auto}
  .ps .hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--green);padding-bottom:8px;margin-bottom:18px}
  .ps .hd .label{color:var(--green)}
  .ps h3{font-family:var(--CA);font-style:italic;font-weight:400;font-size:30pt;line-height:1.05;margin:0 0 4px}
  .ps .who{font-size:12pt;margin-bottom:18px}
  .ps .who b{font-weight:600}
  .ps table{width:100%;border-collapse:collapse;margin:6px 0 14px}
  .ps th{font-size:8.5pt;letter-spacing:.14em;text-transform:uppercase;text-align:left;border-bottom:1px solid #999;padding:6px 6px 6px 0}
  .ps td{border-bottom:1px solid #ddd;padding:9px 6px 9px 0;vertical-align:top}
  .ps td.n,.ps th.n{text-align:right;white-space:nowrap}
  .ps .box{display:inline-block;width:14px;height:14px;border:1.5px solid #333;border-radius:2px;vertical-align:middle}
  .ps .sub{font-size:10pt;color:#555}
  .ps .tot{display:flex;justify-content:flex-end;gap:28px;font-size:12.5pt;margin-top:4px}
  .ps .tot b{font-size:15pt}
  .ps .how{margin-top:18px;padding:10px 12px;border:1px solid #bbb;border-radius:6px;font-size:10.5pt}
  .ps .sign{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:28px;font-size:10pt}
  .ps .sign div{border-top:1px solid #333;padding-top:4px}
  .ps .list td{padding:7px 6px 7px 0}
}
@media (max-width:560px){.row{grid-template-columns:40px minmax(0,1fr)}.right{grid-column:2;justify-items:start;text-align:left}}
</style>
</head>
<body>
<div class="wrap">

  <form class="gate" id="gate" hidden>
    <div class="label">Padel Plant · Staff</div>
    <h1>Weekly order sheet</h1>
    <label class="muted" for="pass">Enter the staff passcode.</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button class="btn" type="submit">Open</button>
    <div class="msg" id="gateMsg" role="alert"></div>
  </form>

  <main id="app" hidden>
    <div class="label">Padel Plant · Member orders · Staff only</div>
    <h1 id="title">Weekly order sheet</h1>
    <p class="muted" id="sub">Orders close Sunday at midnight. Claude adds the week’s order to the Padel Plant Today list every Monday morning.</p>
    <div class="chips" id="weeks" aria-label="Order week"></div>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <button class="btn" type="button" id="printAll">Print pickup sheets</button>
      <button class="btn ghost" type="button" id="refresh">Refresh</button>
      <a class="link" href="/#feature">Pick featured items</a>
      <button class="link" type="button" id="logout">Sign out</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
    <div id="content"></div>
  </main>

</div>
<div id="printArea" aria-hidden="true"></div>
<script>
const STATUSES=['Requested','Ordered','Arrived','Picked up'];
const $=s=>document.querySelector(s);
const money=n=>'$'+Number(n||0).toFixed(2).replace(/\.00$/,'');
const store={get(k){try{return localStorage.getItem('pps_'+k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem('pps_'+k):localStorage.setItem('pps_'+k,v)}catch(e){}}};
let key=store.get('key'), orders=[], week=null;

function el(tag, cls, text){const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e;}
function setMsg(t){ $('#msg').textContent=t||''; }

async function api(path, opts={}){
  const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','x-staff-key':key||'',...(opts.headers||{})}});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){ store.set('key',null); key=null; showGate('That passcode didn’t work.'); throw new Error('auth'); }
  if(!r.ok) throw new Error(j.error||('Error '+r.status));
  return j;
}

function showGate(m){ $('#app').hidden=true; $('#gate').hidden=false; $('#gateMsg').textContent=m||''; $('#pass').focus(); }
$('#gate').addEventListener('submit',e=>{e.preventDefault(); key=$('#pass').value.trim(); if(!key) return; store.set('key',key); load();});
$('#logout').onclick=()=>{store.set('key',null); key=null; showGate();};
$('#refresh').onclick=()=>load();

async function load(){
  try{
    setMsg('Loading orders…');
    const j=await api('/api/orders');
    orders=j.orders||[];
    $('#gate').hidden=true; $('#app').hidden=false; setMsg('');
    const weeks=[...new Set(orders.map(o=>o.week))];
    weeks.sort((a,b)=>weekDate(b)-weekDate(a));
    if(!week||!weeks.includes(week)) week=pickDefault(weeks);
    render(weeks);
  }catch(e){ if(e.message!=='auth'){ $('#gate').hidden=true; $('#app').hidden=false; setMsg('Couldn’t load orders: '+e.message); } }
}
function weekDate(label){ const now=new Date(); const d=new Date(label+', '+now.getFullYear()); if(d-now>200*864e5) d.setFullYear(d.getFullYear()-1); return d; }
function pickDefault(weeks){
  if(!weeks.length) return null;
  const today=new Date(); today.setHours(0,0,0,0);
  const upcoming=weeks.filter(w=>weekDate(w)>=today).sort((a,b)=>weekDate(a)-weekDate(b));
  return upcoming[0]||weeks[0];
}

function render(weeks){
  const wc=$('#weeks'); wc.innerHTML='';
  weeks.forEach(w=>{const b=el('button','chip',w); b.type='button'; b.setAttribute('aria-pressed',String(w===week)); b.onclick=()=>{week=w; render(weeks);}; wc.appendChild(b);});
  const list=orders.filter(o=>o.week===week);
  $('#title').textContent= week ? 'Order for '+week : 'Weekly order sheet';
  const items=list.reduce((n,o)=>n+o.items.reduce((m,i)=>m+(i.qty||1),0),0);
  const memberTotal=list.reduce((n,o)=>n+Number(String(o.member_total).replace(/[^0-9.]/g,'')||0),0);
  const st=$('#stats'); st.innerHTML='';
  [[list.length,'Members'],[items,'Items'],[money(memberTotal),'Member total']].forEach(([v,l])=>{const s=el('div','stat'); s.append(el('b',null,String(v)), el('span',null,l)); st.appendChild(s);});
  const c=$('#content'); c.innerHTML='';
  if(!week||!list.length){ c.appendChild(el('p','empty','No member orders yet. They’ll show up here as soon as someone sends one.')); return; }

  // supplier list per brand
  const brands={}, requests=[];
  list.forEach(o=>o.items.forEach(it=>{
    if(it.sku==='request'||it.request){ requests.push({...it,who:o.name,order:o.id}); return; }
    const b=brands[it.brand]=brands[it.brand]||{};
    const k=[it.product,it.color||'',it.size||''].join('|');
    const r=b[k]=b[k]||{...it,qty:0,who:[],refs:[]};
    r.qty+=it.qty||1; r.who.push(o.name+((it.qty||1)>1?' ×'+it.qty:'')); r.refs.push({order:o.id,idx:it.idx,status:it.status});
  }));
  Object.keys(brands).sort().forEach(brand=>{
    const rows=Object.values(brands[brand]).sort((a,b)=>a.product.localeCompare(b.product));
    const h=el('h2'); h.append(el('span',null,brand+' · to order'));
    const copy=el('button','link','Copy '+brand+' list'); copy.type='button';
    copy.onclick=()=>{
      const txt=rows.map(r=>r.qty+' x '+brand+' '+r.product+(r.color?' / '+r.color:'')+(r.size?' / size '+r.size:'')+(r.sku?' ('+r.sku+')':'')).join('\n');
      navigator.clipboard.writeText(txt).then(()=>setMsg(brand+' list copied.'),()=>setMsg('Copy didn’t work here. Select the rows and copy them instead.'));
    };
    h.appendChild(copy); c.appendChild(h);
    const box=el('div','rows'); c.appendChild(box);
    rows.forEach(r=>{
      const row=el('div','row');
      row.appendChild(el('div','qty',r.qty+'×'));
      const mid=el('div'); mid.style.minWidth='0';
      mid.appendChild(el('div','prod',r.product+(r.color?' · '+r.color:'')+(r.size?' · size '+r.size:'')));
      mid.appendChild(el('div','meta','For '+r.who.join(', ')+(r.sku?' · '+r.sku.replace(/^(hs|wl)-/,'').toUpperCase():'')));
      row.appendChild(mid);
      const right=el('div','right');
      if(r.list_each) right.appendChild(el('div','meta','Retail '+money(r.list_each*r.qty)));
      right.appendChild(statusPill(lowest(r.refs), r.refs));
      row.appendChild(right); box.appendChild(row);
    });
  });
  if(requests.length){
    c.appendChild(Object.assign(el('h2'),{textContent:'Special requests'}));
    const box=el('div','rows'); c.appendChild(box);
    requests.forEach(r=>{
      const row=el('div','row'); row.appendChild(el('div','qty','1×'));
      const mid=el('div'); mid.style.minWidth='0';
      mid.appendChild(el('div','prod',(r.brand||'')+' · '+r.request));
      mid.appendChild(el('div','meta','For '+r.who+' · confirm the price with them before ordering'));
      row.appendChild(mid);
      const right=el('div','right'); right.appendChild(statusPill(r.status,[{order:r.order,idx:r.idx,status:r.status}])); row.appendChild(right);
      box.appendChild(row);
    });
  }

  // by member
  c.appendChild(Object.assign(el('h2'),{textContent:'By member'}));
  list.forEach(o=>{
    const m=el('div','member');
    const top=el('div','top');
    const left=el('div'); left.append(el('div','nm',o.name), el('div','contact',o.phone+' · '+o.email));
    const tot=el('div','right'); tot.append(el('div','prod',o.member_total), el('div','meta',o.membership+' · regular '+o.list_total));
    top.append(left,tot); m.appendChild(top);
    if(o.spam) m.appendChild(el('div','prod','Netlify flagged this order as spam. Check it\u2019s real before ordering.'));
    if(o.notes) m.appendChild(el('div','meta','Note: '+o.notes));
    o.items.forEach(it=>{
      const ln=el('div','line');
      const t=it.request ? (it.brand+' request: '+it.request) : ((it.qty||1)+'× '+it.brand+' '+it.product+(it.color?' · '+it.color:'')+(it.size?' · size '+it.size:''));
      ln.append(el('span','t',t), statusPill(it.status,[{order:o.id,idx:it.idx,status:it.status}]));
      m.appendChild(ln);
    });
    c.appendChild(m);
  });
  const lg=el('p','legend','Tap a status to move it forward: Requested → Ordered → Arrived → Picked up. Changing a supplier row updates every member on it.');
  c.appendChild(lg);
}

function lowest(refs){ return STATUSES[Math.min(...refs.map(r=>STATUSES.indexOf(r.status)))]; }
function statusPill(status, refs){
  const i=STATUSES.indexOf(status);
  const b=el('button','pill s'+i,status); b.type='button';
  b.setAttribute('aria-label','Status '+status+'. Tap to move to '+STATUSES[(i+1)%STATUSES.length]);
  b.onclick=async()=>{
    const next=STATUSES[(i+1)%STATUSES.length];
    b.disabled=true;
    try{
      await api('/api/orders',{method:'POST',body:JSON.stringify({updates:refs.map(r=>({order:r.order,idx:r.idx,status:next}))})});
      refs.forEach(r=>{const o=orders.find(x=>x.id===r.order); if(o&&o.items[r.idx]) o.items[r.idx].status=next;});
      const weeks=[...new Set(orders.map(o=>o.week))].sort((a,b)=>weekDate(b)-weekDate(a));
      render(weeks); setMsg('Marked '+next.toLowerCase()+'.');
    }catch(e){ b.disabled=false; if(e.message!=='auth') setMsg('Couldn’t save that: '+e.message); }
  };
  return b;
}

/* ---------- Pickup sheets (print or save as PDF) ---------- */
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function itemLabel(it){ return it.request ? (it.brand||'')+' request: '+it.request : it.brand+' '+it.product; }
function itemMeta(it){ return [it.color, it.size?'Size '+it.size:null].filter(Boolean).join(' · '); }
function printSheets(){
  // Everything that has arrived and is waiting at the desk, from any order week.
  const list=orders.filter(o=>!o.spam).map(o=>({...o, items:o.items.filter(it=>it.status==='Arrived')})).filter(o=>o.items.length);
  if(!list.length){ setMsg('Nothing is waiting at the desk. Mark items Arrived when they come in.'); return; }
  const today=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  const A=$('#printArea'); let h='';
  // cover: one line per member
  h+='<section class="ps"><div class="hd"><span class="label">Padel Plant · Pro shop pickups</span><span class="label">Printed '+esc(today)+'</span></div>';
  h+='<h3>Pickup checklist</h3><div class="who">'+list.length+' member'+(list.length>1?'s':'')+' with gear waiting at the desk. Each member has their own page after this one.</div>';
  h+='<table class="list"><tr><th></th><th>Member</th><th>Phone</th><th>Membership</th><th class="n">Items</th><th class="n">To charge</th></tr>';
  list.forEach(o=>{ const n=o.items.reduce((m,i)=>m+(i.qty||1),0); const t=o.items.reduce((m,i)=>m+(i.member_each||0)*(i.qty||1),0);
    h+='<tr><td><span class="box"></span></td><td><b>'+esc(o.name)+'</b></td><td>'+esc(o.phone)+'</td><td>'+esc(o.membership)+'</td><td class="n">'+n+'</td><td class="n">'+money(t)+(o.items.some(i=>i.request)?' + request':'')+'</td></tr>'; });
  h+='</table></section>';
  // one page per member
  list.forEach(o=>{
    const reg=o.items.reduce((m,i)=>m+(i.list_each||0)*(i.qty||1),0), mem=o.items.reduce((m,i)=>m+(i.member_each||0)*(i.qty||1),0);
    h+='<section class="ps"><div class="hd"><span class="label">Padel Plant · Pro shop pickup</span><span class="label">Order of '+esc(o.week||'')+'</span></div>';
    h+='<h3>'+esc(o.name)+'</h3><div class="who"><b>'+esc(o.membership||'Membership not given')+'</b> · '+esc(o.phone)+' · '+esc(o.email)+'</div>';
    if(o.notes) h+='<div class="who sub">Note from member: '+esc(o.notes)+'</div>';
    h+='<table><tr><th>Done</th><th>Item</th><th class="n">Qty</th><th class="n">Regular</th><th class="n">Charge</th><th>Ring up in Toast as</th></tr>';
    o.items.forEach(it=>{
      const q=it.qty||1;
      h+='<tr><td><span class="box"></span></td><td><b>'+esc(itemLabel(it))+'</b>'+(itemMeta(it)?'<div class="sub">'+esc(itemMeta(it))+'</div>':'')+'<div class="sub">Status: '+esc(it.status)+'</div></td>';
      h+='<td class="n">'+q+'</td><td class="n">'+(it.list_each?money(it.list_each*q):'—')+'</td><td class="n"><b>'+(it.member_each?money(it.member_each*q):'Price TBC')+'</b></td>';
      h+='<td>Special Order – '+esc(it.brand||'Other')+'</td></tr>';
    });
    h+='</table><div class="tot"><span>Regular '+money(reg)+'</span><span>Member price <b>'+money(mem)+'</b></span></div><div class="tot sub">Plus Virginia sales tax</div>';
    h+='<div class="how"><b>How to ring it up:</b> in Toast, open Retail and add <b>Special Order – [brand]</b> for each item. Type the amount from the Charge column (it already includes their member discount). If the member has already left, create the item on the <b>Merchandise</b> tab in Playbypoint at the same amount and charge it to their account (card on file). Tick Done, then mark the item Picked up on the order sheet.</div>';
    h+='<div class="sign"><div>Rung up by</div><div>Date</div><div>Paid in: Toast / Playbypoint</div></div></section>';
  });
  A.innerHTML=h;
  document.body.classList.add('printing');
  setTimeout(()=>window.print(),50);
}
window.addEventListener('afterprint',()=>document.body.classList.remove('printing'));
$('#printAll').onclick=()=>printSheets();
key ? load() : showGate();
</script>
</body>
</html>
